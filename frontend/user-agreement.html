<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户协议 - 小馨宝-语音助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // CDN备用方案
        if (typeof tailwind === 'undefined') {
            document.write('\u003clink rel="stylesheet" href="https://unpkg.com/tailwindcss@2.2.19/dist/tailwind.min.css">');
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        body {
            font-family: 'Noto Sans SC', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .agreement-container {
            height: calc(100vh - 200px);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gray-50">
    <!-- 头部 -->
    <header class="gradient-bg text-white py-6 shadow-lg">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-heart text-3xl"></i>
                    <h1 class="text-2xl font-bold">小馨宝-语音助手</h1>
                </div>
                <p class="text-sm opacity-90">用户协议</p>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <!-- 协议说明 -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6 fade-in">
                <div class="flex items-center mb-4">
                    <i class="fas fa-file-contract text-blue-500 text-2xl mr-3"></i>
                    <h2 class="text-xl font-semibold text-gray-800">请仔细阅读用户协议</h2>
                </div>
                <p class="text-gray-600">
                    在使用小馨宝语音助手服务之前，请务必仔细阅读并理解以下用户协议。您的使用行为将视为对本协议的接受。
                </p>
            </div>

            <!-- 协议链接区域 -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6 fade-in" style="animation-delay: 0.2s;">
                <div class="text-center">
                    <div class="mb-4">
                        <i class="fas fa-external-link-alt text-blue-500 text-3xl mb-3"></i>
                        <h3 class="text-lg font-semibold text-gray-800 mb-2">查看完整用户协议</h3>
                        <p class="text-gray-600 mb-4">请点击下方链接查看详细的用户协议内容</p>
                    </div>
                    <a href="https://uei55ql5ok.feishu.cn/wiki/Kwxew1trEizLxEkVbnEc27annh2" 
                       target="_blank" 
                       class="inline-flex items-center px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors duration-200 shadow-md hover:shadow-lg">
                        <i class="fas fa-file-contract mr-2"></i>
                        查看用户协议
                        <i class="fas fa-external-link-alt ml-2 text-sm"></i>
                    </a>
                </div>
            </div>

            <!-- 同意区域 -->
            <div class="bg-white rounded-lg shadow-lg p-6 fade-in" style="animation-delay: 0.4s;">
                <div class="flex items-start space-x-3 mb-6">
                    <input type="checkbox" id="agreeCheckbox"
                        class="mt-1 w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                    <label for="agreeCheckbox" class="text-gray-700 cursor-pointer select-none">
                        我已仔细阅读并同意 <a href="https://uei55ql5ok.feishu.cn/wiki/Kwxew1trEizLxEkVbnEc27annh2"
                            target="_blank" class="text-blue-600 hover:underline">《用户协议》</a> 和
                        <a href="#" class="text-blue-600 hover:underline">《隐私政策》</a>
                    </label>
                </div>

                <div class="flex justify-center">
                    <button id="enterButton" disabled
                        class="px-8 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-semibold rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
                        <i class="fas fa-arrow-right mr-2"></i>
                        进入小馨宝
                    </button>
                </div>
            </div>

            <!-- 提示信息 -->
            <div class="text-center mt-6 text-gray-500 text-sm fade-in" style="animation-delay: 0.6s;">
                <i class="fas fa-info-circle mr-1"></i>
                如不同意协议，将无法使用本服务
            </div>
        </div>
    </main>

    <script>
        // DOM加载完成后初始化事件监听器
        document.addEventListener('DOMContentLoaded', function () {
            // 获取元素
            const checkbox = document.getElementById('agreeCheckbox');
            const button = document.getElementById('enterButton');

            // 添加复选框事件监听器
            if (checkbox) {
                checkbox.addEventListener('change', function () {
                    if (this.checked) {
                        button.disabled = false;
                        button.classList.remove('disabled:opacity-50', 'disabled:cursor-not-allowed', 'disabled:transform-none');
                    } else {
                        button.disabled = true;
                        button.classList.add('disabled:opacity-50', 'disabled:cursor-not-allowed', 'disabled:transform-none');
                    }
                });
            }

            // 添加按钮事件监听器
            if (button) {
                button.addEventListener('click', function () {
                    if (!checkbox.checked) {
                        showNotification('请先同意用户协议', 'warning');
                        return;
                    }

                    // 保存用户已同意协议的状态
                    localStorage.setItem('userAgreed', 'true');

                    // 跳转到用户界面
                    window.location.href = 'user-panel.html';
                });
            }
        });

        // 显示通知
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg text-white fade-in ${type === 'warning' ? 'bg-yellow-500' :
                type === 'error' ? 'bg-red-500' :
                    type === 'success' ? 'bg-green-500' : 'bg-blue-500'
                }`;
            notification.innerHTML = `
                <div class="flex items-center">
                    <i class="fas ${type === 'warning' ? 'fa-exclamation-triangle' :
                    type === 'error' ? 'fa-times-circle' :
                        type === 'success' ? 'fa-check-circle' : 'fa-info-circle'
                } mr-2"></i>
                    ${message}
                </div>
            `;

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // 检查是否已经同意过协议（注释掉自动勾选功能）
        document.addEventListener('DOMContentLoaded', () => {
            // 不再自动勾选，让用户每次都需要手动同意
            // if (localStorage.getItem('userAgreed') === 'true') {
            //     document.getElementById('agreeCheckbox').checked = true;
            //     toggleEnterButton();
            // }
        });
    </script>
</body>

</html>
